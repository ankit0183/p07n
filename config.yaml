  save_path: ./ctbcap_rec
  log_path: ./ctbcap_rec/log
  save_space_mib: 512
  log_space_mib: 16
  cut_time: 0
  cut_size_mib: 0
  platform: stripchat
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  edging_mode: false
  debug_mode: true
  ignore_proxy: false
  check_interval: 60
  retry_interval: 60
  ffmpeg_codec: copy
  ffmpeg_extra_args: ''
  auto_restart: true
  max_restart_attempts: 10
  restart_backoff_base: 5.0
  restart_backoff_max: 300.0
