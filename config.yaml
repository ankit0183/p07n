global:
  save_path: ./ctbcap_rec
  log_path: ./ctbcap_rec/log
  save_space_mib: 512
  log_space_mib: 16
  cut_time: 0
  cut_size_mib: 0
  platform: stripchat
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  edging_mode: false
  debug_mode: true
  ignore_proxy: false
  check_interval: 60
  retry_interval: 60
  ffmpeg_codec: copy
  ffmpeg_extra_args: ''
  auto_restart: true
  max_restart_attempts: 10
  restart_backoff_base: 5.0
  restart_backoff_max: 300.0
  download_queue:
    max_concurrent_downloads: 3
    max_concurrent_fetches: 5
    offline_grace_seconds: 30
    fetch_retry_attempts: 3
    fetch_retry_delay: 5.0
    min_free_space_mib: 1024
  notifications:
    enabled: false
    telegram:
      enabled: false
      bot_token: ''
      chat_id: ''
    discord:
      enabled: false
      webhook_url: ''
    ntfy:
      enabled: false
      topic: ''
      server: https://ntfy.sh
  metadata:
    enabled: true
    log_path: ./ctbcap_rec/log/metadata.jsonl
  health_check:
    enabled: true
    port: 8080
