global:
  save_path: ./ctbcap_rec
  log_path: ./ctbcap_rec/log
  save_space_mib: 10240
  log_space_mib: 512
  cut_time: 0
  cut_size_mib: 0
  platform: stripchat
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  edging_mode: false
  debug_mode: false
  ignore_proxy: false
  check_interval: 30
  retry_interval: 30
  ffmpeg_codec: copy
  ffmpeg_extra_args: ''
  auto_restart: true
  max_restart_attempts: 10
  restart_backoff_base: 5.0
  restart_backoff_max: 300.0
  adaptive_check_interval: true
  min_check_interval: 10
  max_check_interval: 300
  priority_boost_online: true
  auto_discover_enabled: true
  auto_discover_interval: 600
  auto_discover_platform: stripchat
  auto_discover_limit: 1000
  auto_add_new_models: false
  web_ui_enabled: true
  web_ui_port: 8081
  bandwidth_limit_mbps: 0
  cpu_limit_percent: 80
  download_queue:
    max_concurrent_downloads: 15
    max_concurrent_fetches: 30
    offline_grace_seconds: 30
    fetch_retry_attempts: 3
    fetch_retry_delay: 3.0
    min_free_space_mib: 2048
    adaptive_concurrency: true
    max_concurrent_downloads_high: 25
    max_concurrent_downloads_low: 5
  notifications:
    enabled: false
    telegram:
      enabled: false
      bot_token: ''
      chat_id: ''
    discord:
      enabled: false
      webhook_url: ''
    ntfy:
      enabled: false
      topic: ''
      server: https://ntfy.sh
  metadata:
    enabled: true
    log_path: ./ctbcap_rec/log/metadata.jsonl
  health_check:
    enabled: true
    port: 8080
